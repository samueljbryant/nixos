import = ["~/nixos_dotfiles/config/alacritty/alacritty-theme/themes/tomorrow_night.toml"]

[font]
size = 11.0

[font.normal]
# family = "Inconsolata Nerd Font Mono"
family = "0xProto Nerd Font Mono"
style = "Regular"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# wispr-flow synths Ctrl+V (not Ctrl+Shift+V) to paste transcriptions
[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"
